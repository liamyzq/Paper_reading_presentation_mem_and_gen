<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Balance of self and crowd at collapse time</title>
  <desc id="desc">At the collapse time, the current state remains closer to the planted sample. A thick self-force arrow points toward that sample, while many thin crowd-force arrows combine into an opposing aggregate crowd force of comparable magnitude.</desc>
  <defs>
    <marker id="redArrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34d59"/></marker>
    <marker id="blueArrow" markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#4f9cff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17304d" flood-opacity=".16"/></filter>
  </defs>
  <rect x="8" y="8" width="744" height="504" rx="28" fill="#fbfcff" stroke="#dbe5f0" stroke-width="3" filter="url(#shadow)"/>
  <text x="380" y="54" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172033">At t = t<tspan baseline-shift="sub" font-size="20">C</tspan>: self and crowd balance</text>

  <circle cx="380" cy="278" r="86" fill="none" stroke="#ccd8e6" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="380" cy="278" r="13" fill="#111827"/>
  <text x="396" y="303" font-family="Inter,Arial,sans-serif" font-size="21" fill="#172033">X<tspan baseline-shift="sub" font-size="15">t</tspan></text>

  <polygon points="380,188 387,205 405,207 391,219 395,237 380,228 365,237 369,219 355,207 373,205" fill="#e34d59" stroke="#ad2635" stroke-width="2"/>
  <line x1="380" y1="262" x2="380" y2="234" stroke="#e34d59" stroke-width="7" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <text x="430" y="235" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#c93443">self force</text>

  <g fill="#73b9ee" stroke="#276aa5" stroke-width="3">
    <circle cx="165" cy="315" r="14"/><circle cx="215" cy="395" r="14"/><circle cx="300" cy="452" r="14"/>
    <circle cx="380" cy="468" r="14"/><circle cx="460" cy="452" r="14"/><circle cx="545" cy="395" r="14"/><circle cx="595" cy="315" r="14"/>
  </g>
  <g stroke="#4f9cff" stroke-width="2.7" opacity=".68" stroke-linecap="round" marker-end="url(#blueArrow)">
    <line x1="365" y1="282" x2="182" y2="312"/><line x1="368" y1="291" x2="229" y2="385"/><line x1="373" y1="294" x2="308" y2="437"/>
    <line x1="380" y1="296" x2="380" y2="451"/><line x1="387" y1="294" x2="452" y2="437"/><line x1="392" y1="291" x2="531" y2="385"/><line x1="395" y1="282" x2="578" y2="312"/>
  </g>
  <line x1="380" y1="296" x2="380" y2="370" stroke="#2d7fca" stroke-width="6" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <text x="435" y="356" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#276aa5">aggregate crowd force</text>

  <text x="380" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="27" font-style="italic" fill="#172033">Z_self  ≈  Z_crowd</text>
</svg>