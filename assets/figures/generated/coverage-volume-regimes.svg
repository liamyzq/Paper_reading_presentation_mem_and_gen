<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Empirical separated volume versus population typical volume</title>
  <desc id="desc">Three panels show under-coverage above the collapse time, equality at the collapse time, and over-coverage below the collapse time.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17304d" flood-opacity=".13"/></filter>
  </defs>
  <rect x="8" y="8" width="964" height="544" rx="28" fill="#fbfcff" stroke="#dbe5f0" stroke-width="3" filter="url(#shadow)"/>
  <text x="490" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="760" fill="#172033">Coverage interpretation of the collapse threshold</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(30,82)">
      <rect width="290" height="430" rx="22" fill="#ffffff" stroke="#dbe5f0" stroke-width="2"/>
      <text x="145" y="42" text-anchor="middle" font-size="25" font-weight="750" fill="#245fb8">t &gt; t<tspan baseline-shift="sub" font-size="17">C</tspan></text>
      <text x="145" y="70" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">under-covered</text>
      <circle cx="145" cy="236" r="104" fill="#d9ecfa" stroke="#8fbddd" stroke-width="3"/>
      <text x="145" y="360" text-anchor="middle" font-size="19" fill="#47637e">V<tspan baseline-shift="sub" font-size="13">pop</tspan></text>
      <g fill="#fff" stroke="#e34d59" stroke-width="4">
        <circle cx="105" cy="194" r="17"/><circle cx="155" cy="174" r="17"/><circle cx="196" cy="208" r="17"/>
        <circle cx="108" cy="252" r="17"/><circle cx="161" cy="244" r="17"/><circle cx="196" cy="276" r="17"/>
      </g>
      <path d="M88 297 C116 321 180 325 213 297" fill="none" stroke="#e34d59" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="145" y="396" text-anchor="middle" font-size="20" font-weight="700" fill="#c93443">V<tspan baseline-shift="sub" font-size="13">sep</tspan> &lt; V<tspan baseline-shift="sub" font-size="13">pop</tspan></text>
    </g>
    <g transform="translate(345,82)">
      <rect width="290" height="430" rx="22" fill="#ffffff" stroke="#dbe5f0" stroke-width="2"/>
      <text x="145" y="42" text-anchor="middle" font-size="25" font-weight="750" fill="#6d4acb">t = t<tspan baseline-shift="sub" font-size="17">C</tspan></text>
      <text x="145" y="70" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">just enough coverage</text>
      <circle cx="145" cy="236" r="104" fill="#d9ecfa" stroke="#8fbddd" stroke-width="3"/>
      <g fill="#fff" stroke="#e34d59" stroke-width="4">
        <circle cx="92" cy="167" r="19"/><circle cx="145" cy="147" r="19"/><circle cx="198" cy="169" r="19"/>
        <circle cx="77" cy="226" r="19"/><circle cx="132" cy="211" r="19"/><circle cx="190" cy="226" r="19"/>
        <circle cx="94" cy="286" r="19"/><circle cx="150" cy="282" r="19"/><circle cx="202" cy="287" r="19"/>
      </g>
      <path d="M53 236 A92 92 0 0 1 237 236 A92 92 0 0 1 53 236" fill="none" stroke="#e34d59" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="145" y="396" text-anchor="middle" font-size="20" font-weight="700" fill="#6d4acb">V<tspan baseline-shift="sub" font-size="13">sep</tspan> ≈ V<tspan baseline-shift="sub" font-size="13">pop</tspan></text>
    </g>
    <g transform="translate(660,82)">
      <rect width="290" height="430" rx="22" fill="#ffffff" stroke="#dbe5f0" stroke-width="2"/>
      <text x="145" y="42" text-anchor="middle" font-size="25" font-weight="750" fill="#c93443">t &lt; t<tspan baseline-shift="sub" font-size="17">C</tspan></text>
      <text x="145" y="70" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">separated neighborhoods dominate</text>
      <circle cx="145" cy="236" r="86" fill="#d9ecfa" stroke="#8fbddd" stroke-width="3"/>
      <g fill="#fff" stroke="#e34d59" stroke-width="4">
        <circle cx="63" cy="135" r="20"/><circle cx="130" cy="119" r="20"/><circle cx="207" cy="142" r="20"/>
        <circle cx="42" cy="215" r="20"/><circle cx="105" cy="196" r="20"/><circle cx="181" cy="197" r="20"/><circle cx="247" cy="218" r="20"/>
        <circle cx="59" cy="302" r="20"/><circle cx="132" cy="320" r="20"/><circle cx="213" cy="300" r="20"/>
      </g>
      <path d="M28 235 A117 117 0 0 1 262 235 A117 117 0 0 1 28 235" fill="none" stroke="#e34d59" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="145" y="396" text-anchor="middle" font-size="20" font-weight="700" fill="#c93443">V<tspan baseline-shift="sub" font-size="13">sep</tspan> &gt; V<tspan baseline-shift="sub" font-size="13">pop</tspan></text>
    </g>
  </g>
</svg>
