<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Separated-volume estimate versus population coverage</title>
  <desc id="desc">Below the collapse time, separated empirical neighborhoods under-cover the population typical set. At the collapse time they just cover it. Above the collapse time, neighborhoods overlap heavily: the formal separated sum n times V_G exceeds V_pop because overlap is counted repeatedly, while the effective covered union remains approximately V_pop.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17304d" flood-opacity=".13"/></filter>
  </defs>
  <rect x="8" y="8" width="964" height="544" rx="28" fill="#fbfcff" stroke="#dbe5f0" stroke-width="3" filter="url(#shadow)"/>
  <text x="490" y="46" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="760" fill="#172033">Separated-volume estimate vs effective population coverage</text>

  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(30,80)">
      <rect width="290" height="432" rx="22" fill="#ffffff" stroke="#dbe5f0" stroke-width="2"/>
      <text x="145" y="40" text-anchor="middle" font-size="25" font-weight="750" fill="#c93443">t &lt; t<tspan baseline-shift="sub" font-size="17">C</tspan></text>
      <text x="145" y="68" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">separated / under-cover</text>
      <circle cx="145" cy="230" r="104" fill="#d9ecfa" stroke="#8fbddd" stroke-width="3"/>
      <g fill="#fff" stroke="#e34d59" stroke-width="4">
        <circle cx="105" cy="202" r="16"/><circle cx="145" cy="185" r="16"/><circle cx="182" cy="214" r="16"/>
        <circle cx="111" cy="250" r="16"/><circle cx="156" cy="246" r="16"/>
      </g>
      <path d="M84 181 C116 151 179 159 205 205 C223 237 198 278 148 286 C104 293 76 260 84 181 Z" fill="none" stroke="#e34d59" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="145" y="360" text-anchor="middle" font-size="19" fill="#47637e">population typical set V<tspan baseline-shift="sub" font-size="13">pop</tspan></text>
      <text x="145" y="394" text-anchor="middle" font-size="21" font-weight="700" fill="#c93443">V<tspan baseline-shift="sub" font-size="13">sep</tspan> &lt; V<tspan baseline-shift="sub" font-size="13">pop</tspan></text>
      <text x="145" y="418" text-anchor="middle" font-size="16" fill="#64748b">finite samples cover only part of the typical set</text>
    </g>

    <g transform="translate(345,80)">
      <rect width="290" height="432" rx="22" fill="#ffffff" stroke="#dbe5f0" stroke-width="2"/>
      <text x="145" y="40" text-anchor="middle" font-size="25" font-weight="750" fill="#6d4acb">t = t<tspan baseline-shift="sub" font-size="17">C</tspan></text>
      <text x="145" y="68" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">just enough coverage</text>
      <circle cx="145" cy="230" r="104" fill="#d9ecfa" stroke="#8fbddd" stroke-width="3"/>
      <g fill="#fff" stroke="#e34d59" stroke-width="4">
        <circle cx="92" cy="163" r="20"/><circle cx="145" cy="145" r="20"/><circle cx="198" cy="166" r="20"/>
        <circle cx="77" cy="224" r="20"/><circle cx="132" cy="208" r="20"/><circle cx="190" cy="224" r="20"/>
        <circle cx="94" cy="286" r="20"/><circle cx="150" cy="282" r="20"/><circle cx="202" cy="287" r="20"/>
      </g>
      <path d="M53 230 A92 92 0 0 1 237 230 A92 92 0 0 1 53 230" fill="none" stroke="#e34d59" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="145" y="394" text-anchor="middle" font-size="21" font-weight="700" fill="#6d4acb">V<tspan baseline-shift="sub" font-size="13">sep</tspan> ≈ V<tspan baseline-shift="sub" font-size="13">pop</tspan></text>
      <text x="145" y="418" text-anchor="middle" font-size="16" fill="#64748b">the separated-volume estimate meets the population volume</text>
    </g>

    <g transform="translate(660,80)">
      <rect width="290" height="432" rx="22" fill="#ffffff" stroke="#dbe5f0" stroke-width="2"/>
      <text x="145" y="40" text-anchor="middle" font-size="25" font-weight="750" fill="#245fb8">t &gt; t<tspan baseline-shift="sub" font-size="17">C</tspan></text>
      <text x="145" y="68" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">overlapping / population-like</text>
      <circle cx="145" cy="230" r="104" fill="#d9ecfa" stroke="#8fbddd" stroke-width="3"/>
      <g fill="#ffffff" fill-opacity=".42" stroke="#e34d59" stroke-width="3">
        <circle cx="92" cy="176" r="38"/><circle cx="145" cy="160" r="38"/><circle cx="198" cy="178" r="38"/>
        <circle cx="79" cy="232" r="38"/><circle cx="132" cy="222" r="38"/><circle cx="188" cy="228" r="38"/>
        <circle cx="102" cy="286" r="38"/><circle cx="158" cy="286" r="38"/><circle cx="207" cy="274" r="38"/>
      </g>
      <circle cx="145" cy="230" r="104" fill="none" stroke="#2d7fca" stroke-width="3" stroke-dasharray="8 7"/>
      <text x="145" y="365" text-anchor="middle" font-size="17" font-weight="700" fill="#c93443">formal nV<tspan baseline-shift="sub" font-size="12">G</tspan> &gt; V<tspan baseline-shift="sub" font-size="12">pop</tspan></text>
      <text x="145" y="391" text-anchor="middle" font-size="16" fill="#64748b">because overlaps are counted repeatedly</text>
      <text x="145" y="418" text-anchor="middle" font-size="17" font-weight="700" fill="#245fb8">effective covered union ≈ V<tspan baseline-shift="sub" font-size="12">pop</tspan></text>
    </g>
  </g>
</svg>