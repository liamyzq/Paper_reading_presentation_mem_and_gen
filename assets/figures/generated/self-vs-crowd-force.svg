<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Self versus crowd at low diffusion time</title>
  <desc id="desc">The current state is much closer to the planted sample than to the other empirical samples. One thick self-force arrow points from the current state toward the planted sample, while many thin crowd-force arrows point toward distant samples.</desc>
  <defs>
    <marker id="redArrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e34d59"/></marker>
    <marker id="blueArrow" markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#4f9cff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17304d" flood-opacity=".16"/></filter>
  </defs>
  <rect x="8" y="8" width="744" height="504" rx="28" fill="#fbfcff" stroke="#dbe5f0" stroke-width="3" filter="url(#shadow)"/>
  <text x="380" y="54" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750" fill="#172033">Small backward time: self dominates</text>

  <circle cx="380" cy="292" r="84" fill="none" stroke="#ccd8e6" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="380" cy="292" r="13" fill="#111827"/>
  <text x="397" y="317" font-family="Inter,Arial,sans-serif" font-size="21" fill="#172033">X<tspan baseline-shift="sub" font-size="15">t</tspan></text>

  <polygon points="380,198 387,215 405,217 391,229 395,247 380,238 365,247 369,229 355,217 373,215" fill="#e34d59" stroke="#ad2635" stroke-width="2"/>
  <text x="430" y="215" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#c93443">planted sample</text>
  <line x1="380" y1="276" x2="380" y2="244" stroke="#e34d59" stroke-width="7" stroke-linecap="round" marker-end="url(#redArrow)"/>
  <text x="430" y="262" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#c93443">self: one strong force</text>

  <g fill="#73b9ee" stroke="#276aa5" stroke-width="3">
    <circle cx="155" cy="170" r="14"/><circle cx="110" cy="300" r="14"/><circle cx="175" cy="430" r="14"/>
    <circle cx="605" cy="170" r="14"/><circle cx="650" cy="300" r="14"/><circle cx="585" cy="430" r="14"/>
    <circle cx="285" cy="470" r="14"/><circle cx="475" cy="470" r="14"/>
  </g>
  <g stroke="#4f9cff" stroke-width="2.6" opacity=".63" stroke-linecap="round" marker-end="url(#blueArrow)">
    <line x1="367" y1="282" x2="171" y2="180"/><line x1="364" y1="293" x2="127" y2="300"/><line x1="368" y1="303" x2="190" y2="419"/>
    <line x1="393" y1="282" x2="589" y2="180"/><line x1="396" y1="293" x2="633" y2="300"/><line x1="392" y1="303" x2="570" y2="419"/>
    <line x1="374" y1="306" x2="293" y2="454"/><line x1="386" y1="306" x2="467" y2="454"/>
  </g>
  <text x="548" y="468" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#276aa5">crowd: many weak forces</text>
  <text x="380" y="498" text-anchor="middle" font-family="Georgia,serif" font-size="27" font-style="italic" fill="#172033">Z_self  ≫  Z_crowd</text>
</svg>