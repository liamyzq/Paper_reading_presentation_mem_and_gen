<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#fbfcff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.l{font-size:20px}.s{font-size:16px;fill:#64748b}</style><text x="500" y="48" class="t" text-anchor="middle">A noised training image returns to its source identity</text><defs><g id="face"><circle cx="0" cy="0" r="58" fill="#f2c05e"/><circle cx="-20" cy="-12" r="6" fill="#172033"/><circle cx="20" cy="-12" r="6" fill="#172033"/><path d="M-24 20 Q0 40 25 20" fill="none" stroke="#172033" stroke-width="5"/></g></defs><g opacity=".18" transform="translate(120 280)"><use href="#face"/></g><g opacity=".32" transform="translate(260 280)"><use href="#face"/></g><g opacity=".48" transform="translate(400 280)"><use href="#face"/></g><g opacity=".65" transform="translate(540 280)"><use href="#face"/></g><g opacity=".82" transform="translate(680 280)"><use href="#face"/></g><g transform="translate(820 280)"><use href="#face"/></g><g fill="#64748b" opacity=".5"><circle cx="90" cy="210" r="5"/><circle cx="145" cy="330" r="5"/><circle cx="235" cy="230" r="4"/><circle cx="290" cy="315" r="4"/><circle cx="380" cy="205" r="4"/><circle cx="420" cy="345" r="4"/></g><text x="190" y="290" class="t">→</text><text x="330" y="290" class="t">→</text><text x="470" y="290" class="t">→</text><text x="610" y="290" class="t">→</text><text x="750" y="290" class="t">→</text><text x="500" y="455" class="l" text-anchor="middle">same training identity becomes progressively clearer</text><text x="120" y="520" class="s" text-anchor="middle">high noise</text><text x="820" y="520" class="s" text-anchor="middle">low noise</text></svg>