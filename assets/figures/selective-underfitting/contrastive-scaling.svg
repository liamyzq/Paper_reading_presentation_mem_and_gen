<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#fbfcff"/><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.l{font-size:20px}.s{font-size:16px;fill:#64748b}</style><text x="500" y="48" class="t" text-anchor="middle">Model scaling has opposite effects on- and off-shell</text><line x1="110" y1="500" x2="920" y2="500" stroke="#172033" stroke-width="3"/><line x1="110" y1="500" x2="110" y2="95" stroke="#172033" stroke-width="3"/><path d="M110 150 C300 250 540 370 920 430" fill="none" stroke="#4f9cff" stroke-width="8"/><path d="M110 430 C300 350 560 220 920 150" fill="none" stroke="#ef6f88" stroke-width="8"/><text x="690" y="420" class="l" fill="#4f9cff" style="fill:#4f9cff">on-shell error decreases</text><text x="690" y="135" class="l" fill="#ef6f88" style="fill:#ef6f88">off-shell deviation increases</text><text x="515" y="550" class="s" text-anchor="middle">model scale / generative quality</text><text x="42" y="300" class="s" text-anchor="middle" transform="rotate(-90 42 300)">discrepancy from empirical score</text></svg>