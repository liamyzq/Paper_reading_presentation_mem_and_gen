name: Finalize static presentation

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[automation] check presentation script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize readable static files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .cleanup/static-deck.tar.gz.b64 | tar -xz -C .

      - name: Validate static deck
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/slides.js
          test "$(grep -o '<section class=\"slide' index.html | wc -l | tr -d ' ')" = "32"
          ! grep -R -E 'DecompressionStream|\.gz\.b64|eval\(source\)|fetch\(.+slides' index.html assets/slides.js assets/style.css
          test -f assets/figures/dynamical-regimes/recap.png
          test -f assets/figures/selective-underfitting/extrapolation-illustration.png

      - name: Remove legacy loaders and build scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build qa .cleanup .cleanup-probe
          rm -f assets/*.gz.b64
          rm -f .github/workflows/apply-presentation-source.yml
          rm -f .github/workflows/build-presentation.yml
          rm -f .github/workflows/build-presentation-static.yml
          rm -f .github/workflows/qa-presentation.yml
          rm -f .github/workflows/cleanup-static-deck.yml
          rm -f .github/workflows/check-presentation-script.yml

      - name: Commit final static repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Flatten presentation into static source and remove legacy loaders'
          git push origin HEAD:main
