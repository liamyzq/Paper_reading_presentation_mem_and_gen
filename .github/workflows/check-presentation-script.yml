name: Check presentation script

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[automation] check presentation script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/slides.js
      - name: Record success
        run: |
          mkdir -p qa
          printf 'assets/slides.js: syntax OK\n' > qa/presentation-script-check.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/presentation-script-check.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record presentation script syntax check'
          git push origin HEAD:main
