name: Apply presentation source

on:
  push:
    branches: [main]
    paths:
      - .build/index.html.gz.b64
      - .build/style.css.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize final HTML and CSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base64 -d .build/index.html.gz.b64 | gzip -d > index.html
          base64 -d .build/style.css.gz.b64 | gzip -d > assets/style.css
      - name: Commit final density fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/style.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish dense presentation slides'
          git push origin HEAD:main
