name: Apply presentation source

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - .build/index.html.gz.b64
      - .build/style.css.gz.b64
      - .build/slides.js.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.issue.title == '[automation] apply presentation source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize final presentation source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base64 -d .build/index.html.gz.b64 | gzip -d > index.html
          base64 -d .build/style.css.gz.b64 | gzip -d > assets/style.css
          base64 -d .build/slides.js.gz.b64 | gzip -d > assets/slides.js
      - name: Commit materialized presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/style.css assets/slides.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expand symbols, typography, and proof appendix'
          git push origin HEAD:main
