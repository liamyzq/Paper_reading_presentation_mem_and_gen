name: QA HTML presentation

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - .build/qa-trigger.txt

permissions:
  contents: write

jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.issue.title == '[automation] qa presentation slides'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render slides and preserve diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p qa/screenshots
          : > qa/render.log
          {
            echo "runner=$(uname -a)"
            echo "node=$(node --version 2>&1)"
            echo "npm=$(npm --version 2>&1)"
            echo "chrome candidates:"
            command -v google-chrome || true
            command -v google-chrome-stable || true
            command -v chromium || true
          } > qa/diagnostic.txt

          npm init -y >> qa/render.log 2>&1
          npm install puppeteer-core@24.12.1 >> qa/render.log 2>&1
          NPM_STATUS=$?
          echo "npm_status=$NPM_STATUS" >> qa/diagnostic.txt

          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          echo "chrome_bin=$CHROME_BIN" >> qa/diagnostic.txt

          if [ $NPM_STATUS -eq 0 ] && [ -n "$CHROME_BIN" ]; then
            export CHROME_BIN
            python3 -m http.server 8000 >> qa/render.log 2>&1 &
            SERVER_PID=$!
            sleep 3
            cat > /tmp/render-slides.js <<'NODE'
            const puppeteer = require('puppeteer-core');
            const fs = require('fs');
            (async () => {
              const browser = await puppeteer.launch({
                executablePath: process.env.CHROME_BIN,
                headless: true,
                args: ['--no-sandbox','--disable-dev-shm-usage']
              });
              const page = await browser.newPage();
              await page.setViewport({width:1600,height:900,deviceScaleFactor:1});
              const report = [];
              for (let i=1; i<=22; i++) {
                await page.goto(`http://127.0.0.1:8000/#${i}`, {waitUntil:'networkidle0', timeout:60000});
                await new Promise(r => setTimeout(r, 250));
                const info = await page.evaluate(() => {
                  const slide = document.querySelector('.slide.active');
                  const images = [...slide.querySelectorAll('img')].map(img => ({
                    src: img.getAttribute('src'), naturalWidth: img.naturalWidth,
                    naturalHeight: img.naturalHeight,
                    renderedWidth: Math.round(img.getBoundingClientRect().width),
                    renderedHeight: Math.round(img.getBoundingClientRect().height)
                  }));
                  return {
                    title: slide.dataset.title,
                    clientWidth: slide.clientWidth,
                    clientHeight: slide.clientHeight,
                    scrollWidth: slide.scrollWidth,
                    scrollHeight: slide.scrollHeight,
                    overflowX: slide.scrollWidth > slide.clientWidth + 2,
                    overflowY: slide.scrollHeight > slide.clientHeight + 2,
                    images,
                    katexErrors: [...slide.querySelectorAll('.katex-error')].length
                  };
                });
                report.push({slide:i, ...info});
                await page.screenshot({path:`qa/screenshots/slide-${String(i).padStart(2,'0')}.png`});
              }
              fs.writeFileSync('qa/layout-report.json', JSON.stringify(report,null,2));
              await browser.close();
            })().catch(error => {
              console.error(error);
              process.exit(1);
            });
            NODE
            node /tmp/render-slides.js >> qa/render.log 2>&1
            RENDER_STATUS=$?
            kill $SERVER_PID || true
          else
            RENDER_STATUS=99
          fi
          echo "render_status=$RENDER_STATUS" >> qa/diagnostic.txt

          python3 - <<'PY' >> qa/render.log 2>&1
          from pathlib import Path
          try:
              from PIL import Image, ImageDraw
          except Exception as exc:
              print(f"Pillow import failed: {exc}")
              raise SystemExit(0)
          files = sorted(Path('qa/screenshots').glob('slide-*.png'))
          pages = []
          for offset in range(0, len(files), 4):
              page = Image.new('RGB', (1600, 1000), 'white')
              draw = ImageDraw.Draw(page)
              for j, path in enumerate(files[offset:offset+4]):
                  img = Image.open(path).convert('RGB')
                  img.thumbnail((760, 430))
                  x = 25 + (j % 2) * 800
                  y = 35 + (j // 2) * 490
                  page.paste(img, (x + (760-img.width)//2, y + 25))
                  draw.text((x, y), path.stem, fill='black')
              pages.append(page)
          if pages:
              pages[0].save('qa/contact-sheet.pdf', save_all=True, append_images=pages[1:], resolution=120)
          print(f"screenshots={len(files)}")
          PY

      - name: Commit QA outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/diagnostic.txt qa/render.log
          git add qa/layout-report.json qa/contact-sheet.pdf 2>/dev/null || true
          git commit -m 'Add presentation visual QA results' || exit 0
          git push origin HEAD:main
